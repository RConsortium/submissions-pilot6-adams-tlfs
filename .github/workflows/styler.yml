name: Style R Code

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  style:
    name: Run styler
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install styler
        run: |
          install.packages("styler", repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Run styler (dry-run)
        id: run_styler
        run: |
          library(styler)
          result <- style_dir("code", dry = "on", include_roxygen_examples = FALSE)
          changed_files <- result$file[result$changed %in% TRUE]
          if (length(changed_files) == 0) {
            cat("STYLE_PASS=true\n", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
            cat("No styling issues found.\n")
          } else {
            cat("STYLE_PASS=false\n", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
            writeLines(changed_files, "style_results.txt")
            cat("Files that need styling:\n")
            cat(paste(changed_files, collapse = "\n"), "\n")
          }
        shell: Rscript {0}

      - name: Find existing styler bot comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: find_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- styler-bot -->'

      - name: Post PR comment – success
        if: >
          github.event_name == 'pull_request' &&
          steps.run_styler.outputs.STYLE_PASS == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- styler-bot -->
            ## ✅ Styler – No Formatting Issues Found

            All R files in `code/` are consistently formatted. 🎉

            ---
            **Run locally:**
            ```r
            # Install styler if needed
            install.packages("styler")

            # Check which files need formatting (dry run – no files are changed)
            library(styler)
            styler::style_dir("code", dry = "on")

            # Apply formatting to all files
            styler::style_dir("code")
            ```

      - name: Build PR comment – findings
        if: >
          github.event_name == 'pull_request' &&
          steps.run_styler.outputs.STYLE_PASS == 'false'
        id: build_comment
        run: |
          with open("style_results.txt") as f:
              files = [l.rstrip() for l in f.readlines() if l.strip()]

          file_list = "\n".join(f"- `{f}`" for f in files)

          body = f"""<!-- styler-bot -->
## ⚠️ Styler – Formatting Issues Found

The following {len(files)} file(s) in `code/` are not consistently formatted. Please run `styler::style_dir("code")` locally and commit the result.

<details>
<summary>📂 {len(files)} file(s) need formatting – click to expand</summary>

{file_list}

</details>

---
**Run locally to reproduce or fix:**
```r
# Install styler if needed
install.packages("styler")

# Check which files need formatting (dry run – no files are changed)
library(styler)
styler::style_dir("code", dry = "on")

# Apply formatting to all files
styler::style_dir("code")
```

> After running `style_dir`, review the changes with `git diff`, then commit and push.
"""

          with open("comment_body.md", "w") as f:
              f.write(body)
        shell: python3 {0}

      - name: Post PR comment – findings
        if: >
          github.event_name == 'pull_request' &&
          steps.run_styler.outputs.STYLE_PASS == 'false'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body-path: comment_body.md

      - name: Fail job when formatting issues found
        if: steps.run_styler.outputs.STYLE_PASS == 'false'
        run: |
          echo "Styling issues were found. See the PR comment for details."
          exit 1
